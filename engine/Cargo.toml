[package]
name = "linuxarena-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "GPL-2.0-only"

[dependencies]

[lints.rust]
warnings = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
lto = true
codegen-units = 1
