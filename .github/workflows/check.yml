name: Quality Gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Quality Gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.0'
          cache: npm
      - name: Windows GNU linker
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit
      - name: Configure Windows GNU host
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" >> $env:GITHUB_PATH
          rustup toolchain install 1.99.0-x86_64-pc-windows-gnu --profile minimal --component rustfmt,clippy
      - name: Configure Linux GNU host
        if: runner.os == 'Linux'
        run: |
          rustup toolchain install 1.99.0-x86_64-unknown-linux-gnu --profile minimal --component rustfmt,clippy
          rustup override set 1.99.0-x86_64-unknown-linux-gnu
      - run: npm ci --no-audit --no-fund
      - run: npm run quality
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: quality-${{ matrix.os }}
          path: .quality/report.json
          if-no-files-found: error
